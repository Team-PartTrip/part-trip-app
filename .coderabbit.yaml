# CodeRabbit 리뷰 설정
# https://docs.coderabbit.ai/reference/yaml-template
#
# 이 파일은 PR 의 head 브랜치에서 읽힌다. main 에 있어야 적용된다.

language: ko-KR

reviews:
  # 체험 기간에 한 번 크게 받는 리뷰라 깐깐한 쪽으로 둔다
  profile: assertive

  path_filters:
    # 색상·여백 상수만 있어서 리뷰할 게 없다. 파일 수가 많아 빼면 그만큼
    # 분석량이 실제 로직으로 간다.
    - "!**/*.styles.ts"
    - "!ios/**"
    - "!android/**"

  auto_review:
    enabled: true
    # 전체 코드를 한 번에 보려고 빈 브랜치를 기준점으로 삼는다.
    # 기본값은 기본 브랜치(main) 로 가는 PR 만 보기 때문에 여기 적어야 돈다.
    base_branches:
      - "review-baseline"
